name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  adversarial:
    # The taxonomy can regress silently: it keeps returning decisions, they
    # are just wrong or useless (escalate-everything). This fails the build
    # if auto-tag coverage collapses on realistic text, or if any catalog
    # gets a wrong auto-tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run coverage benchmark
        run: npx tsx src/eval_v2.ts
      - name: Assert coverage and zero wrong auto-tags
        run: |
          cat > ci_check.mts <<'EOF'
          import { buildCoverageReport } from "./src/eval_v2.js";
          const report = buildCoverageReport();
          for (const [name, r] of Object.entries(report)) {
            if (r.v2.autoWrong !== 0) {
              throw new Error(name + ": v2 auto-tagged something wrong: " + JSON.stringify(r.v2));
            }
          }
          if (report.adversarial.v2.autoRate < 0.6) {
            throw new Error("adversarial auto rate regressed: " + report.adversarial.v2.autoRate);
          }
          if (report.holdout.v2.autoRate < 0.4) {
            throw new Error("holdout auto rate regressed: " + report.holdout.v2.autoRate);
          }
          console.log("coverage and zero-wrong-autos hold");
          EOF
          npx tsx ci_check.mts && rm ci_check.mts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run eval
        run: npx tsx src/eval.ts
